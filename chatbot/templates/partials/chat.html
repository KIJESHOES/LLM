<section id="section-chat" class="hidden flex-col h-full bg-white dark:bg-slate-900 transition-colors duration-300">
    <header class="h-16 border-b border-slate-100 dark:border-slate-800 flex items-center px-8 justify-between bg-white dark:bg-slate-900 shrink-0">
        <div class="flex items-center gap-2">
            <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
            <h2 class="font-bold text-slate-700 dark:text-slate-200 uppercase tracking-wider text-sm">Chat AI Mode</h2>
        </div>
    </header>

    <div id="chat-box" class="flex-1 overflow-y-auto p-6 md:p-10 space-y-6 chat-scroll">
    </div>

    <footer class="p-6 border-t border-slate-100 dark:border-slate-800 bg-white dark:bg-slate-900 transition-colors duration-300">
        <div class="max-w-4xl mx-auto flex items-center gap-3">
            <input type="hidden" id="csrf_token" value="{{ csrf_token }}">
            
            <div class="flex-1 flex items-center bg-slate-100 dark:bg-slate-800 rounded-2xl focus-within:ring-2 focus-within:ring-blue-500 transition-all pr-2 relative">
                
                <input type="text" id="user-input" placeholder="Tanyakan pasal atau regulasi..." 
                       class="flex-1 bg-transparent border-none px-6 py-4 outline-none text-[15px] text-slate-700 dark:text-white placeholder-slate-400 dark:placeholder-slate-500" 
                       onkeypress="handleEnter(event)">
                
                <div class="h-8 w-px bg-slate-300 dark:bg-slate-600 mx-1"></div>
                
                <div class="relative inline-block w-32 shrink-0">
                    <input type="hidden" id="panjang-jawaban" value="sedang">
                    
                    <button type="button" onclick="toggleDropdown(event)" id="dropdown-btn" class="w-full flex items-center justify-between bg-transparent text-slate-600 dark:text-slate-300 py-2.5 px-3 rounded-xl text-sm font-semibold hover:bg-slate-200/50 dark:hover:bg-slate-700/50 transition-all focus:outline-none">
                        <span id="dropdown-text">Sedang</span>
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-slate-400 dark:text-slate-500 transition-transform duration-200" id="dropdown-icon" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
                        </svg>
                    </button>

                    <div id="dropdown-menu" class="hidden absolute bottom-full right-0 mb-2 w-36 bg-white dark:bg-slate-800 border border-slate-100 dark:border-slate-700 rounded-xl shadow-xl overflow-hidden transition-all z-50 origin-bottom-right">
                        <div class="p-1 flex flex-col gap-1">
                            <button type="button" onclick="pilihOpsi('pendek', 'Pendek')" class="opsi-btn w-full text-left px-3 py-2 text-sm text-slate-600 dark:text-slate-300 rounded-lg hover:bg-blue-50 hover:text-blue-600 dark:hover:bg-blue-900/30 dark:hover:text-blue-400 transition">Pendek</button>
                            <button type="button" onclick="pilihOpsi('sedang', 'Sedang')" class="opsi-btn w-full text-left px-3 py-2 text-sm bg-blue-50 text-blue-600 dark:bg-blue-900/30 dark:text-blue-400 font-bold rounded-lg transition">Sedang</button>
                            <button type="button" onclick="pilihOpsi('panjang', 'Panjang')" class="opsi-btn w-full text-left px-3 py-2 text-sm text-slate-600 dark:text-slate-300 rounded-lg hover:bg-blue-50 hover:text-blue-600 dark:hover:bg-blue-900/30 dark:hover:text-blue-400 transition">Panjang</button>
                        </div>
                    </div>
                </div>
            </div>

            <button id="send-btn" onclick="kirimPesan()" class="bg-blue-600 hover:bg-blue-700 dark:bg-blue-500 dark:hover:bg-blue-600 text-white px-8 py-4 rounded-2xl font-bold transition-all disabled:bg-slate-300 dark:disabled:bg-slate-700 shrink-0">
                Kirim
            </button>
        </div>
    </footer>
</section>

<script>
    function toggleDropdown(e) {
        e.stopPropagation(); // Biar event click luar ga ketrigger bareng
        const menu = document.getElementById('dropdown-menu');
        const icon = document.getElementById('dropdown-icon');
        
        menu.classList.toggle('hidden');
        
        // Puter icon panah ke atas kalau kebuka
        if (!menu.classList.contains('hidden')) {
            icon.style.transform = 'rotate(180deg)';
        } else {
            icon.style.transform = 'rotate(0deg)';
        }
    }

    function pilihOpsi(value, text) {
        // 1. Ubah teks di tombol
        document.getElementById('dropdown-text').innerText = text;
        
        // 2. Simpan nilainya ke hidden input (penting buat backend lu)
        document.getElementById('panjang-jawaban').value = value;
        
        // 3. Update styling menu yang aktif (biar yang dipilih keliatan bold & biru)
        const btns = document.querySelectorAll('.opsi-btn');
        btns.forEach(btn => {
            if(btn.innerText === text) {
                btn.className = "opsi-btn w-full text-left px-3 py-2 text-sm bg-blue-50 text-blue-600 dark:bg-blue-900/30 dark:text-blue-400 font-bold rounded-lg transition";
            } else {
                btn.className = "opsi-btn w-full text-left px-3 py-2 text-sm text-slate-600 dark:text-slate-300 rounded-lg hover:bg-blue-50 hover:text-blue-600 dark:hover:bg-blue-900/30 dark:hover:text-blue-400 transition";
            }
        });

        // 4. Tutup menu setelah diklik
        document.getElementById('dropdown-menu').classList.add('hidden');
        document.getElementById('dropdown-icon').style.transform = 'rotate(0deg)';
    }

    // Auto-tutup menu dropdown kalau user klik di sembarang tempat (luar menu)
    document.addEventListener('click', function(e) {
        const menu = document.getElementById('dropdown-menu');
        const icon = document.getElementById('dropdown-icon');
        if (menu && !menu.classList.contains('hidden') && !e.target.closest('#dropdown-btn')) {
            menu.classList.add('hidden');
            icon.style.transform = 'rotate(0deg)';
        }
    });
</script>
