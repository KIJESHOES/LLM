<section id="section-chat" class="hidden flex-col h-full bg-white dark:bg-slate-900 transition-colors duration-300">
    <header class="h-16 border-b border-slate-100 dark:border-slate-800 flex items-center px-8 justify-between bg-white dark:bg-slate-900 shrink-0">
        <div class="flex items-center gap-2">
            <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
            <h2 class="font-bold text-slate-700 dark:text-slate-200 uppercase tracking-wider text-sm">Chat AI Mode</h2>
        </div>
    </header>

    <div id="chat-box" class="flex-1 overflow-y-auto p-6 md:p-10 space-y-6 chat-scroll">
        </div>

    <footer class="p-6 border-t border-slate-100 dark:border-slate-800 bg-white dark:bg-slate-900 transition-colors duration-300">
        <div class="max-w-4xl mx-auto relative flex items-center gap-3">
            <input type="hidden" id="csrf_token" value="{{ csrf_token }}">
            <input type="text" id="user-input" placeholder="Tanyakan pasal atau regulasi..." 
                   class="flex-1 bg-slate-100 dark:bg-slate-800 dark:text-white border-none rounded-2xl px-6 py-4 focus:ring-2 focus:ring-blue-500 outline-none text-[15px] transition-all placeholder-slate-400 dark:placeholder-slate-500" 
                   onkeypress="handleEnter(event)">
            <button id="send-btn" onclick="kirimPesan()" class="bg-blue-600 hover:bg-blue-700 dark:bg-blue-500 dark:hover:bg-blue-600 text-white px-8 py-4 rounded-2xl font-bold transition-all disabled:bg-slate-300 dark:disabled:bg-slate-700">
                Kirim
            </button>
        </div>
    </footer>
</section>
