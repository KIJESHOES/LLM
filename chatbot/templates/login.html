<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AI K3 PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200 min-h-screen flex items-center justify-center p-6 transition-colors duration-300">

    <div class="w-full max-w-md bg-white dark:bg-slate-800 rounded-3xl shadow-2xl border border-slate-100 dark:border-slate-700 p-8 sm:p-10 relative overflow-hidden">
        <div class="absolute -top-24 -right-24 w-48 h-48 bg-blue-500/10 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-24 -left-24 w-48 h-48 bg-cyan-500/10 rounded-full blur-3xl"></div>

        <div class="relative z-10 text-center mb-8">
            <div class="w-16 h-16 bg-blue-100 dark:bg-blue-900/50 rounded-2xl flex items-center justify-center mx-auto mb-4 text-3xl shadow-sm ring-4 ring-blue-50 dark:ring-blue-900/30">
                🛡️
            </div>
            <h1 class="text-3xl font-black text-slate-800 dark:text-white tracking-tight">Selamat Datang</h1>
            <p class="text-slate-500 dark:text-slate-400 mt-2 text-sm">Masuk ke sistem AI K3 PRO untuk mulai konsultasi</p>
        </div>

        <form method="POST" class="relative z-10 space-y-5">
            {% csrf_token %}
            
            {% if form.errors %}
            <div class="p-3 bg-red-50 dark:bg-red-900/30 border border-red-200 dark:border-red-800 rounded-xl text-red-600 dark:text-red-400 text-sm text-center">
                Username atau password salah. Silakan coba lagi.
            </div>
            {% endif %}

            <div>
                <label for="username" class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2">Username</label>
                <input type="text" name="username" id="username" required 
                    class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 dark:text-white transition-all outline-none"
                    placeholder="Masukkan username Anda">
            </div>

            <div>
                <label for="password" class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2">Password</label>
                <input type="password" name="password" id="password" required 
                    class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 dark:text-white transition-all outline-none"
                    placeholder="••••••••">
            </div>

            <button type="submit" 
                class="w-full bg-blue-600 hover:bg-blue-700 dark:bg-blue-500 dark:hover:bg-blue-600 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-blue-500/30 transition-all transform hover:-translate-y-0.5 mt-2">
                Masuk ke Sistem
            </button>
        </form>

        <div class="mt-8 text-center relative z-10 space-y-3">
            <p class="text-sm text-slate-600 dark:text-slate-300">
                Belum punya akun? <a href="/register/" class="font-bold text-blue-600 dark:text-blue-400 hover:text-blue-700 dark:hover:text-blue-300 hover:underline transition-colors">Daftar sekarang</a>
            </p>
            <div class="border-t border-slate-100 dark:border-slate-700/60 w-1/2 mx-auto mt-4 mb-2"></div>
            <p class="text-xs text-slate-500 dark:text-slate-500 mt-2">
                Kembali ke <a href="/" class="font-semibold text-slate-500 dark:text-slate-400 hover:underline">Halaman Utama</a>
            </p>
        </div>
    </div>

</body>
</html>
